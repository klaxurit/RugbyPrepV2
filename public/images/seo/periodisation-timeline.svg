<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" width="100%">
  <title>Timeline de pré-saison rugby en 12 semaines : accumulation, force, puissance</title>
  <defs>
    <linearGradient id="bgp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f9fafb"/>
      <stop offset="100%" stop-color="#f3f4f6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="340" rx="12" fill="url(#bgp)"/>
  <text x="400" y="36" text-anchor="middle" font-family="Lexend, system-ui, sans-serif" font-size="18" font-weight="600" fill="#111827">Pré-saison rugby — 12 semaines</text>
  <!-- Timeline axis -->
  <line x1="60" y1="160" x2="740" y2="160" stroke="#d1d5db" stroke-width="3" stroke-linecap="round"/>
  <!-- Block 1: Accumulation S1-S4 -->
  <rect x="60" y="70" width="220" height="72" rx="10" fill="#3b82f6" opacity="0.9"/>
  <text x="170" y="97" text-anchor="middle" font-family="Lexend, system-ui, sans-serif" font-size="15" font-weight="600" fill="#fff">Accumulation</text>
  <text x="170" y="116" text-anchor="middle" font-family="Lexend, system-ui, sans-serif" font-size="11" fill="#dbeafe">Volume ↑, Intensité modérée</text>
  <text x="170" y="132" text-anchor="middle" font-family="Lexend, system-ui, sans-serif" font-size="10" fill="#bfdbfe">Base de travail, patterns, tissu</text>
  <!-- Block 2: Force S5-S8 -->
  <rect x="290" y="70" width="220" height="72" rx="10" fill="#16a34a" opacity="0.9"/>
  <text x="400" y="97" text-anchor="middle" font-family="Lexend, system-ui, sans-serif" font-size="15" font-weight="600" fill="#fff">Force</text>
  <text x="400" y="116" text-anchor="middle" font-family="Lexend, system-ui, sans-serif" font-size="11" fill="#dcfce7">Volume ↓, Intensité ↑</text>
  <text x="400" y="132" text-anchor="middle" font-family="Lexend, system-ui, sans-serif" font-size="10" fill="#bbf7d0">Force relative, récupération stricte</text>
  <!-- Block 3: Puissance S9-S12 -->
  <rect x="520" y="70" width="220" height="72" rx="10" fill="#ea580c" opacity="0.9"/>
  <text x="630" y="97" text-anchor="middle" font-family="Lexend, system-ui, sans-serif" font-size="15" font-weight="600" fill="#fff">Puissance</text>
  <text x="630" y="116" text-anchor="middle" font-family="Lexend, system-ui, sans-serif" font-size="11" fill="#ffedd5">Exécution rapide, Affûtage</text>
  <text x="630" y="132" text-anchor="middle" font-family="Lexend, system-ui, sans-serif" font-size="10" fill="#fed7aa">Force → vitesse, intégration terrain</text>
  <!-- Week markers -->
  <g font-family="Lexend, system-ui, sans-serif" font-size="11" fill="#374151" font-weight="500">
    <circle cx="60" cy="160" r="5" fill="#3b82f6"/>
    <text x="60" y="182" text-anchor="middle">S1</text>
    <circle cx="116" cy="160" r="4" fill="#3b82f6"/>
    <text x="116" y="182" text-anchor="middle">S2</text>
    <circle cx="172" cy="160" r="4" fill="#3b82f6"/>
    <text x="172" y="182" text-anchor="middle">S3</text>
    <!-- Deload S4 -->
    <circle cx="228" cy="160" r="6" fill="#93c5fd" stroke="#3b82f6" stroke-width="2"/>
    <text x="228" y="182" text-anchor="middle">S4</text>
    <circle cx="290" cy="160" r="5" fill="#16a34a"/>
    <text x="290" y="182" text-anchor="middle">S5</text>
    <circle cx="346" cy="160" r="4" fill="#16a34a"/>
    <text x="346" y="182" text-anchor="middle">S6</text>
    <circle cx="402" cy="160" r="4" fill="#16a34a"/>
    <text x="402" y="182" text-anchor="middle">S7</text>
    <!-- Deload S8 -->
    <circle cx="458" cy="160" r="6" fill="#86efac" stroke="#16a34a" stroke-width="2"/>
    <text x="458" y="182" text-anchor="middle">S8</text>
    <circle cx="520" cy="160" r="5" fill="#ea580c"/>
    <text x="520" y="182" text-anchor="middle">S9</text>
    <circle cx="576" cy="160" r="4" fill="#ea580c"/>
    <text x="576" y="182" text-anchor="middle">S10</text>
    <circle cx="632" cy="160" r="4" fill="#ea580c"/>
    <text x="632" y="182" text-anchor="middle">S11</text>
    <circle cx="688" cy="160" r="4" fill="#ea580c"/>
    <text x="688" y="182" text-anchor="middle">S12</text>
    <!-- Championship start -->
    <circle cx="740" cy="160" r="7" fill="#111827"/>
    <text x="740" y="182" text-anchor="middle" font-weight="600">J1</text>
  </g>
  <!-- Deload arrows -->
  <text x="228" y="206" text-anchor="middle" font-family="Lexend, system-ui, sans-serif" font-size="9" fill="#3b82f6" font-weight="500">↓ Deload</text>
  <text x="458" y="206" text-anchor="middle" font-family="Lexend, system-ui, sans-serif" font-size="9" fill="#16a34a" font-weight="500">↓ Deload</text>
  <!-- Volume / Intensity curves legend -->
  <line x1="80" y1="240" x2="720" y2="240" stroke="#e5e7eb" stroke-width="1"/>
  <!-- Volume curve (descending) -->
  <polyline points="80,255 170,250 280,265 400,275 520,285 630,292 720,298" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6,4"/>
  <!-- Intensity curve (ascending) -->
  <polyline points="80,298 170,295 280,288 400,275 520,265 630,258 720,252" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Legend -->
  <line x1="80" y1="325" x2="100" y2="325" stroke="#3b82f6" stroke-width="2.5" stroke-dasharray="6,4"/>
  <text x="106" y="329" font-family="Lexend, system-ui, sans-serif" font-size="10" fill="#374151">Volume</text>
  <line x1="165" y1="325" x2="185" y2="325" stroke="#ea580c" stroke-width="2.5"/>
  <text x="191" y="329" font-family="Lexend, system-ui, sans-serif" font-size="10" fill="#374151">Intensité</text>
  <text x="740" y="329" text-anchor="end" font-family="Lexend, system-ui, sans-serif" font-size="9" fill="#9ca3af">RugbyForge — Périodisation par blocs</text>
</svg>