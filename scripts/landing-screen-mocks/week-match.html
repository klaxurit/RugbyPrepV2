<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=390, initial-scale=1" />
  <link rel="stylesheet" href="./_phone.css" />
</head>
<body>
  <div class="screen">
    <div class="mono">Semaine · 10–16 mars</div>
    <div style="font-size:28px;font-weight:900;letter-spacing:-0.04em;line-height:1">Semaine de match</div>
    <div class="muted" style="font-size:13px;font-weight:600;line-height:1.4">
      Volume calé sur le samedi — primer J-2, pas de séance lourde.
    </div>

    <div class="card" style="border-color:rgba(123,13,30,0.4)">
      <div class="row">
        <div>
          <div class="mono" style="color:#E9B8BF">Match</div>
          <div style="font-size:16px;font-weight:900;margin-top:4px">RC Dijon · Samedi</div>
        </div>
        <div style="font-size:12px;font-weight:800;color:#C8303F">J-4</div>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px;flex:1">
      <div class="card">
        <div class="row">
          <div>
            <div style="font-size:14px;font-weight:900">Lun · Upper</div>
            <div class="muted" style="font-size:11px;font-weight:600;margin-top:3px">Force · 4 blocs</div>
          </div>
          <div class="mono" style="color:#8FCF9A">Fait</div>
        </div>
      </div>
      <div class="card" style="border-color:rgba(200,48,63,0.45);background:rgba(123,13,30,0.12)">
        <div class="row">
          <div>
            <div style="font-size:14px;font-weight:900">Mer · Lower</div>
            <div class="muted" style="font-size:11px;font-weight:600;margin-top:3px">Volume modéré · prépa match</div>
          </div>
          <div class="mono" style="color:#E9B8BF">Aujourd’hui</div>
        </div>
      </div>
      <div class="card">
        <div class="row">
          <div>
            <div style="font-size:14px;font-weight:900">Ven · Primer</div>
            <div class="muted" style="font-size:11px;font-weight:600;margin-top:3px">J-2 · activation légère</div>
          </div>
          <div class="mono">Prévu</div>
        </div>
      </div>
      <div class="card" style="opacity:0.75">
        <div class="row">
          <div>
            <div style="font-size:14px;font-weight:900">Sam · Match</div>
            <div class="muted" style="font-size:11px;font-weight:600;margin-top:3px">Club · pas de musculation</div>
          </div>
          <div class="mono">Match</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
