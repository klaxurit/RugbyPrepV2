<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" width="100%">
  <title>Zones ACWR au rugby : sous-charge, optimale, vigilance et danger</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f9fafb"/>
      <stop offset="100%" stop-color="#f3f4f6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="320" rx="12" fill="url(#bg)"/>
  <text x="400" y="38" text-anchor="middle" font-family="Lexend, system-ui, sans-serif" font-size="18" font-weight="600" fill="#111827">Zones ACWR — Ratio charge aiguë / charge chronique</text>
  <!-- Gauge bar background -->
  <rect x="60" y="65" width="680" height="56" rx="8" fill="#e5e7eb"/>
  <!-- Zone 1: Sous-charge < 0.8 -->
  <rect x="60" y="65" width="170" height="56" rx="8" fill="#3b82f6" opacity="0.85"/>
  <!-- Zone 2: Optimale 0.8-1.3 -->
  <rect x="230" y="65" width="230" height="56" fill="#16a34a" opacity="0.85"/>
  <!-- Zone 3: Vigilance 1.3-1.5 -->
  <rect x="460" y="65" width="110" height="56" fill="#ea580c" opacity="0.85"/>
  <!-- Zone 4: Danger > 1.5 -->
  <rect x="570" y="65" width="170" height="56" rx="0 8 8 0" fill="#dc2626" opacity="0.85"/>
  <rect x="570" y="65" width="170" height="56" fill="#dc2626" opacity="0.85"/>
  <rect x="728" y="65" width="12" height="56" rx="0" fill="#dc2626" opacity="0.85"/>
  <rect x="730" y="65" width="10" height="56" rx="8" fill="#dc2626" opacity="0.85"/>
  <!-- Round left corner only on first -->
  <!-- Round right corner only on last -->
  <!-- Zone labels on bars -->
  <text x="145" y="99" text-anchor="middle" font-family="Lexend, system-ui, sans-serif" font-size="15" font-weight="600" fill="#fff">Sous-charge</text>
  <text x="345" y="99" text-anchor="middle" font-family="Lexend, system-ui, sans-serif" font-size="15" font-weight="600" fill="#fff">Zone optimale</text>
  <text x="515" y="99" text-anchor="middle" font-family="Lexend, system-ui, sans-serif" font-size="15" font-weight="600" fill="#fff">Vigilance</text>
  <text x="655" y="99" text-anchor="middle" font-family="Lexend, system-ui, sans-serif" font-size="15" font-weight="600" fill="#fff">Danger</text>
  <!-- Threshold markers -->
  <line x1="230" y1="58" x2="230" y2="128" stroke="#111827" stroke-width="2"/>
  <text x="230" y="148" text-anchor="middle" font-family="Lexend, system-ui, sans-serif" font-size="14" font-weight="500" fill="#111827">0.8</text>
  <line x1="460" y1="58" x2="460" y2="128" stroke="#111827" stroke-width="2"/>
  <text x="460" y="148" text-anchor="middle" font-family="Lexend, system-ui, sans-serif" font-size="14" font-weight="500" fill="#111827">1.3</text>
  <line x1="570" y1="58" x2="570" y2="128" stroke="#111827" stroke-width="2"/>
  <text x="570" y="148" text-anchor="middle" font-family="Lexend, system-ui, sans-serif" font-size="14" font-weight="500" fill="#111827">1.5</text>
  <!-- Descriptions below -->
  <rect x="60" y="170" width="170" height="68" rx="8" fill="#dbeafe"/>
  <text x="145" y="193" text-anchor="middle" font-family="Lexend, system-ui, sans-serif" font-size="11" font-weight="500" fill="#1e40af">Déconditionnement</text>
  <text x="145" y="210" text-anchor="middle" font-family="Lexend, system-ui, sans-serif" font-size="11" fill="#1e40af">progressif</text>
  <text x="145" y="228" text-anchor="middle" font-family="Lexend, system-ui, sans-serif" font-size="10" fill="#3b82f6">→ Remonter la charge</text>
  <rect x="240" y="170" width="210" height="68" rx="8" fill="#dcfce7"/>
  <text x="345" y="193" text-anchor="middle" font-family="Lexend, system-ui, sans-serif" font-size="11" font-weight="500" fill="#166534">Charge construite</text>
  <text x="345" y="210" text-anchor="middle" font-family="Lexend, system-ui, sans-serif" font-size="11" fill="#166534">et soutenable</text>
  <text x="345" y="228" text-anchor="middle" font-family="Lexend, system-ui, sans-serif" font-size="10" fill="#16a34a">→ Maintenir le plan</text>
  <rect x="460" y="170" width="110" height="68" rx="8" fill="#ffedd5"/>
  <text x="515" y="193" text-anchor="middle" font-family="Lexend, system-ui, sans-serif" font-size="11" font-weight="500" fill="#9a3412">La marge</text>
  <text x="515" y="210" text-anchor="middle" font-family="Lexend, system-ui, sans-serif" font-size="11" fill="#9a3412">diminue</text>
  <text x="515" y="228" text-anchor="middle" font-family="Lexend, system-ui, sans-serif" font-size="10" fill="#ea580c">→ Pas de volume gratuit</text>
  <rect x="580" y="170" width="160" height="68" rx="8" fill="#fecaca"/>
  <text x="660" y="193" text-anchor="middle" font-family="Lexend, system-ui, sans-serif" font-size="11" font-weight="500" fill="#991b1b">Risque de blessure</text>
  <text x="660" y="210" text-anchor="middle" font-family="Lexend, system-ui, sans-serif" font-size="11" fill="#991b1b">nettement accru</text>
  <text x="660" y="228" text-anchor="middle" font-family="Lexend, system-ui, sans-serif" font-size="10" fill="#dc2626">→ Deload / réduire</text>
  <!-- Footer -->
  <text x="400" y="272" text-anchor="middle" font-family="Lexend, system-ui, sans-serif" font-size="11" fill="#6b7280">Basé sur Gabbett 2016, Hulin 2016 — Knowledge base RugbyForge</text>
  <text x="400" y="290" text-anchor="middle" font-family="Lexend, system-ui, sans-serif" font-size="10" fill="#9ca3af">Session-RPE = ressenti × durée (min). Semaine = salle + terrain + match.</text>
</svg>