<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=390, initial-scale=1" />
  <link rel="stylesheet" href="./_phone.css" />
</head>
<body>
  <div class="screen" style="justify-content:flex-end;padding-top:80px;background:rgba(0,0,0,0.55)">
    <div style="background:#1A1513;border:1px solid rgba(242,232,216,0.1);border-radius:28px 28px 0 0;padding:22px 18px 28px;margin:0 -18px -28px;box-shadow:0 -20px 60px rgba(0,0,0,0.45)">
      <div class="pill">
        <span class="dot">✦</span>
        Ton programme évolue
      </div>
      <h1 class="serif" style="font-size:28px;margin-top:14px;color:#F2E8D8">
        Charge élevée
        <br />
        <span style="color:rgba(242,232,216,0.7)">ACWR 1.42 — tu choisis comment continuer</span>
      </h1>

      <div style="margin-top:18px">
        <button class="choice selected" type="button">
          <span class="badge">Recommandé</span>
          <strong>Alléger le volume</strong>
          <span>−20 à 30 % cette semaine pour rester dans la zone sûre.</span>
        </button>
        <button class="choice" type="button">
          <strong>Garder mon plan</strong>
          <span>Je gère — je connais mes sensations.</span>
        </button>
        <button class="choice" type="button">
          <strong>Sauter une séance</strong>
          <span>Retirer une séance pour récupérer plus vite.</span>
        </button>
      </div>

      <button class="btn" style="margin-top:10px" type="button">Valider mon choix</button>
      <div class="muted" style="text-align:center;font-size:11px;font-weight:600;margin-top:10px">
        Tu pourras ajuster dans les 24 h
      </div>
    </div>
  </div>
</body>
</html>
