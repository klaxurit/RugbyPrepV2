<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" width="100%">
  <title>Priorités d'entraînement par poste au rugby : avants, 3e lignes, arrières</title>
  <defs>
    <linearGradient id="bgpp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f9fafb"/>
      <stop offset="100%" stop-color="#f3f4f6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="380" rx="12" fill="url(#bgpp)"/>
  <text x="400" y="36" text-anchor="middle" font-family="Lexend, system-ui, sans-serif" font-size="18" font-weight="600" fill="#111827">Priorités d'entraînement par poste</text>
  <!-- Category labels -->
  <g font-family="Lexend, system-ui, sans-serif" font-size="11" fill="#6b7280" font-weight="500">
    <text x="250" y="62" text-anchor="middle">Force max</text>
    <text x="400" y="62" text-anchor="middle">Puissance</text>
    <text x="550" y="62" text-anchor="middle">Vitesse</text>
    <text x="700" y="62" text-anchor="middle">Robustesse</text>
  </g>
  <!-- AVANTS -->
  <rect x="40" y="78" width="720" height="84" rx="10" fill="#fff" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="40" y="78" width="6" height="84" rx="3" fill="#16a34a"/>
  <text x="60" y="104" font-family="Lexend, system-ui, sans-serif" font-size="14" font-weight="600" fill="#111827">Avants</text>
  <text x="60" y="120" font-family="Lexend, system-ui, sans-serif" font-size="10" fill="#6b7280">Piliers, talonneurs, 2e lignes</text>
  <!-- Force max: 90% -->
  <rect x="185" y="96" width="130" height="18" rx="4" fill="#16a34a" opacity="0.85"/>
  <text x="250" y="109" text-anchor="middle" font-family="Lexend, system-ui, sans-serif" font-size="10" font-weight="500" fill="#fff">90%</text>
  <!-- Puissance: 50% -->
  <rect x="345" y="96" width="72" height="18" rx="4" fill="#16a34a" opacity="0.6"/>
  <text x="381" y="109" text-anchor="middle" font-family="Lexend, system-ui, sans-serif" font-size="10" font-weight="500" fill="#fff">50%</text>
  <!-- Vitesse: 30% -->
  <rect x="500" y="96" width="43" height="18" rx="4" fill="#16a34a" opacity="0.4"/>
  <text x="522" y="109" text-anchor="middle" font-family="Lexend, system-ui, sans-serif" font-size="10" font-weight="500" fill="#374151">30%</text>
  <!-- Robustesse: 85% -->
  <rect x="640" y="96" width="116" height="18" rx="4" fill="#16a34a" opacity="0.8"/>
  <text x="698" y="109" text-anchor="middle" font-family="Lexend, system-ui, sans-serif" font-size="10" font-weight="500" fill="#fff">85%</text>
  <!-- Detail text -->
  <text x="60" y="150" font-family="Lexend, system-ui, sans-serif" font-size="9" fill="#9ca3af">Squat, hinge, carries, gainage, travail du cou, isométries, tolérance au contact</text>
  <!-- 3e LIGNES -->
  <rect x="40" y="178" width="720" height="84" rx="10" fill="#fff" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="40" y="178" width="6" height="84" rx="3" fill="#ea580c"/>
  <text x="60" y="204" font-family="Lexend, system-ui, sans-serif" font-size="14" font-weight="600" fill="#111827">3e lignes</text>
  <text x="60" y="220" font-family="Lexend, system-ui, sans-serif" font-size="10" fill="#6b7280">Flankers, n°8</text>
  <!-- Force max: 55% -->
  <rect x="185" y="196" width="80" height="18" rx="4" fill="#ea580c" opacity="0.6"/>
  <text x="225" y="209" text-anchor="middle" font-family="Lexend, system-ui, sans-serif" font-size="10" font-weight="500" fill="#fff">55%</text>
  <!-- Puissance: 85% -->
  <rect x="340" y="196" width="120" height="18" rx="4" fill="#ea580c" opacity="0.85"/>
  <text x="400" y="209" text-anchor="middle" font-family="Lexend, system-ui, sans-serif" font-size="10" font-weight="500" fill="#fff">85%</text>
  <!-- Vitesse: 70% -->
  <rect x="495" y="196" width="100" height="18" rx="4" fill="#ea580c" opacity="0.7"/>
  <text x="545" y="209" text-anchor="middle" font-family="Lexend, system-ui, sans-serif" font-size="10" font-weight="500" fill="#fff">70%</text>
  <!-- Robustesse: 60% -->
  <rect x="645" y="196" width="86" height="18" rx="4" fill="#ea580c" opacity="0.6"/>
  <text x="688" y="209" text-anchor="middle" font-family="Lexend, system-ui, sans-serif" font-size="10" font-weight="500" fill="#fff">60%</text>
  <!-- Detail text -->
  <text x="60" y="250" font-family="Lexend, system-ui, sans-serif" font-size="9" fill="#9ca3af">Med ball, deadlift, sauts, sled, conditioning, répétition d'efforts</text>
  <!-- ARRIERES -->
  <rect x="40" y="278" width="720" height="84" rx="10" fill="#fff" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="40" y="278" width="6" height="84" rx="3" fill="#3b82f6"/>
  <text x="60" y="304" font-family="Lexend, system-ui, sans-serif" font-size="14" font-weight="600" fill="#111827">Arrières</text>
  <text x="60" y="320" font-family="Lexend, system-ui, sans-serif" font-size="10" fill="#6b7280">Demis, centres, ailiers, arrière</text>
  <!-- Force max: 35% -->
  <rect x="185" y="296" width="50" height="18" rx="4" fill="#3b82f6" opacity="0.5"/>
  <text x="210" y="309" text-anchor="middle" font-family="Lexend, system-ui, sans-serif" font-size="10" font-weight="500" fill="#374151">35%</text>
  <!-- Puissance: 60% -->
  <rect x="345" y="296" width="86" height="18" rx="4" fill="#3b82f6" opacity="0.65"/>
  <text x="388" y="309" text-anchor="middle" font-family="Lexend, system-ui, sans-serif" font-size="10" font-weight="500" fill="#fff">60%</text>
  <!-- Vitesse: 90% -->
  <rect x="493" y="296" width="130" height="18" rx="4" fill="#3b82f6" opacity="0.9"/>
  <text x="558" y="309" text-anchor="middle" font-family="Lexend, system-ui, sans-serif" font-size="10" font-weight="500" fill="#fff">90%</text>
  <!-- Robustesse: 40% -->
  <rect x="648" y="296" width="58" height="18" rx="4" fill="#3b82f6" opacity="0.45"/>
  <text x="677" y="309" text-anchor="middle" font-family="Lexend, system-ui, sans-serif" font-size="10" font-weight="500" fill="#374151">40%</text>
  <!-- Detail text -->
  <text x="60" y="350" font-family="Lexend, system-ui, sans-serif" font-size="9" fill="#9ca3af">Unilatéral, sprint court, pliométrie, travail rotatif, qualité d'appui</text>
  <!-- Footer -->
  <text x="400" y="374" text-anchor="middle" font-family="Lexend, system-ui, sans-serif" font-size="9" fill="#9ca3af">RugbyForge — Les pourcentages indiquent la priorité relative d'entraînement</text>
</svg>