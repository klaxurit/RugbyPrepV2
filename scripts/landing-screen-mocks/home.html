<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=390, initial-scale=1" />
  <link rel="stylesheet" href="./_phone.css" />
</head>
<body>
  <div class="screen">
    <div class="row">
      <div>
        <div class="mono">Mardi · Semaine 6</div>
        <div style="font-size:26px;font-weight:900;letter-spacing:-0.04em;margin-top:4px">Bonjour, Alex</div>
      </div>
      <div style="width:40px;height:40px;border-radius:14px;background:#7B0D1E;display:grid;place-items:center;font-weight:900">RF</div>
    </div>

    <div class="card" style="background:linear-gradient(135deg,rgba(123,13,30,0.45),rgba(255,255,255,0.03));border-color:rgba(123,13,30,0.45)">
      <div class="mono" style="color:#E9B8BF">Prochain match</div>
      <div class="row" style="margin-top:8px;align-items:flex-end">
        <div>
          <div style="font-size:20px;font-weight:900;letter-spacing:-0.03em">RC Dijon</div>
          <div class="muted" style="font-size:12px;margin-top:4px;font-weight:600">Samedi · J-4 · Déplacement</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:28px;font-weight:900;color:#C8303F">04</div>
          <div class="mono">jours</div>
        </div>
      </div>
    </div>

    <div class="row" style="gap:12px">
      <div class="card" style="flex:1">
        <div class="mono">Score de forme</div>
        <div style="font-size:32px;font-weight:900;margin-top:6px">78<span style="font-size:14px;color:#9C8F80">/100</span></div>
        <div class="muted" style="font-size:11px;font-weight:600;margin-top:4px">Charge maîtrisée</div>
      </div>
      <div class="card" style="flex:1">
        <div class="mono">ACWR</div>
        <div style="font-size:32px;font-weight:900;margin-top:6px">1.12</div>
        <div class="muted" style="font-size:11px;font-weight:600;margin-top:4px">Zone optimale</div>
      </div>
    </div>

    <div class="card" style="flex:1">
      <div class="mono">Aujourd’hui</div>
      <div style="font-size:18px;font-weight:900;margin-top:8px;letter-spacing:-0.02em">Lower · Force</div>
      <div class="muted" style="font-size:12px;font-weight:600;margin-top:6px;line-height:1.4">
        4 blocs · ~55 min · Spécifique 2ᵉ ligne
      </div>
      <div style="margin-top:16px" class="btn">Démarrer la séance</div>
    </div>
  </div>
</body>
</html>
