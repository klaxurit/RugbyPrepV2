<svg width="1200" height="720" viewBox="0 0 1200 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="720" rx="36" fill="#17100D"/>
  <rect x="32" y="32" width="1136" height="656" rx="28" fill="url(#paint0_linear)"/>
  <text x="80" y="128" fill="#F8F2EA" font-family="Lexend, Arial, sans-serif" font-size="54" font-weight="800">Periodisation rugby</text>
  <text x="80" y="176" fill="#D2C9BF" font-family="Lexend, Arial, sans-serif" font-size="24">Exemple simple sur 12 semaines pour un joueur amateur</text>

  <line x1="120" y1="360" x2="1080" y2="360" stroke="#AA9F95" stroke-width="8" stroke-linecap="round"/>
  <path d="M1080 360L1038 334V386L1080 360Z" fill="#AA9F95"/>

  <rect x="120" y="256" width="280" height="208" rx="28" fill="#304B3E"/>
  <text x="156" y="312" fill="#F8F2EA" font-family="Lexend, Arial, sans-serif" font-size="30" font-weight="700">Semaines 1 a 4</text>
  <text x="156" y="356" fill="#F8F2EA" font-family="Lexend, Arial, sans-serif" font-size="24">Accumulation</text>
  <text x="156" y="394" fill="#DDF0E6" font-family="Lexend, Arial, sans-serif" font-size="18">Volume plus haut</text>
  <text x="156" y="424" fill="#DDF0E6" font-family="Lexend, Arial, sans-serif" font-size="18">Base technique et tissu</text>

  <rect x="460" y="232" width="280" height="256" rx="28" fill="#744526"/>
  <text x="496" y="288" fill="#F8F2EA" font-family="Lexend, Arial, sans-serif" font-size="30" font-weight="700">Semaines 5 a 8</text>
  <text x="496" y="332" fill="#F8F2EA" font-family="Lexend, Arial, sans-serif" font-size="24">Force</text>
  <text x="496" y="370" fill="#FFE0CF" font-family="Lexend, Arial, sans-serif" font-size="18">Volume modere</text>
  <text x="496" y="400" fill="#FFE0CF" font-family="Lexend, Arial, sans-serif" font-size="18">Intensite plus haute</text>
  <text x="496" y="430" fill="#FFE0CF" font-family="Lexend, Arial, sans-serif" font-size="18">Deload en sortie de bloc</text>

  <rect x="800" y="272" width="280" height="176" rx="28" fill="#8A2A20"/>
  <text x="836" y="328" fill="#F8F2EA" font-family="Lexend, Arial, sans-serif" font-size="30" font-weight="700">Semaines 9 a 12</text>
  <text x="836" y="372" fill="#F8F2EA" font-family="Lexend, Arial, sans-serif" font-size="24">Puissance</text>
  <text x="836" y="410" fill="#FFD6D1" font-family="Lexend, Arial, sans-serif" font-size="18">Vitesse, affutage, integration terrain</text>

  <rect x="80" y="540" width="1040" height="92" rx="24" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
  <text x="120" y="596" fill="#D2C9BF" font-family="Lexend, Arial, sans-serif" font-size="22">Principe cle: construire d'abord la base, pousser ensuite la force, puis transformer en vitesse utile avant la competition.</text>

  <defs>
    <linearGradient id="paint0_linear" x1="70" y1="40" x2="1120" y2="680" gradientUnits="userSpaceOnUse">
      <stop stop-color="#241813"/>
      <stop offset="1" stop-color="#150F0C"/>
    </linearGradient>
  </defs>
</svg>
